[workspace]
name = "mini-pi-plus-beyondmimic"
version = "0.1.0"
description = "BeyondMimic für HighTorque pi_plus, mit Pixi"
channels = ["conda-forge"]
platforms = ["linux-64"]

[system-requirements]
libc = { family = "glibc", version = "2.35" }

[pypi-options]
extra-index-urls = ["https://pypi.nvidia.com"]
no-build-isolation = ["flatdict"]
dependency-overrides = { sentry-sdk = ">=2.0.0" }

[dependencies]
python = "3.11.*"
pip = "*"
setuptools = "<80" 
packaging = "==23.0" 
libstdcxx-ng = ">=12"
libgcc-ng = ">=12"
cmake = "*"
git = "*"
gxx = "12.*"

[pypi-dependencies]
"isaacsim" = { version = "==5.0.0", extras = ["all", "extscache"] }

isaaclab        = { path = "../IsaacLab/source/isaaclab",        editable = true }
isaaclab_assets = { path = "../IsaacLab/source/isaaclab_assets", editable = true }
isaaclab_tasks  = { path = "../IsaacLab/source/isaaclab_tasks",  editable = true }
isaaclab_rl     = { path = "../IsaacLab/source/isaaclab_rl",     editable = true }
isaaclab_mimic  = { path = "../IsaacLab/source/isaaclab_mimic",  editable = true }

rsl-rl-lib = "==2.3.1"
whole_body_tracking = { path = "source/whole_body_tracking", editable = true }
wandb = "*"
pandas = "*"
rich = "*"

[tasks]
train   = "python scripts/rsl_rl/train.py"
play    = "python scripts/rsl_rl/play.py"
sim2sim = "python scripts/sim2sim.py"

# --- Zweites Env für GMR-Retargeting (Python 3.10) ---
[feature.gmr.dependencies]
python = "3.10.*"
pip = "*"
libstdcxx-ng = ">=12"

[feature.gmr.pypi-dependencies]
general-motion-retargeting = { path = "GMR", editable = true }

# --- Drittes Env für Blackwell-GPUs (RTX 50xx, sm_120): Torch auf CUDA 12.8 ---
# Identisch zu `default`, nur Torch/Vision/Audio aus dem cu128-Index (enthält sm_120-Kernel).
# Default-Build (cu126 von PyPI) kann auf der 5090 keine Kernel ausführen.
# Nutzung auf der 5090:  pixi run -e 5090 train ...
[feature.cu128.pypi-dependencies]
torch       = { version = "==2.7.0",  index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "==0.22.0", index = "https://download.pytorch.org/whl/cu128" }
torchaudio  = { version = "==2.7.0",  index = "https://download.pytorch.org/whl/cu128" }

# --- Env for GVHMR (video -> SMPL-X motion extraction, Python 3.10, CUDA 12.1) ---
# Standalone like `gmr` (no-default-feature). CUDA 12.1 stack exactly per GVHMR
# requirements.txt; the pytorch3d wheel is built specifically for torch 2.3.0+cu121.
# Runs on cu121-capable GPUs (sm_<=90). For the 5090 (sm_120) torch would need cu128
# and pytorch3d a source rebuild -> separate effort.
[feature.gvhmr.dependencies]
python = "3.10.*"
pip = "*"
setuptools = ">=68,<80"
packaging = ">=23,<25"   # lightning 2.3.0 needs packaging<25; conda otherwise pins 26.x
libstdcxx-ng = ">=12"
libgcc-ng = ">=12"
gxx = "12.*"          # build toolchain for chumpy / cython_bbox / lapx
cmake = "*"
git = "*"
ffmpeg = "*"          # GVHMR reads/writes video (ffmpeg-python calls the binary)
cython = "*"          # build dep for cython_bbox (no-build-isolation)

[feature.gvhmr.pypi-dependencies]
# GVHMR itself (editable, like GMR)
gvhmr = { path = "GVHMR", editable = true }

# PyTorch (CUDA 12.1) — exactly as in requirements.txt
torch       = { version = "==2.3.0",  index = "https://download.pytorch.org/whl/cu121" }
torchvision = { version = "==0.18.0", index = "https://download.pytorch.org/whl/cu121" }
timm = "==0.9.12"

# Lightning + Hydra
lightning = "==2.3.0"
hydra-core = "==1.3"
hydra-zen = "*"
hydra_colorlog = "*"
rich = "*"

# Common utilities
numpy = "==1.23.5"
matplotlib = "*"
tensorboardX = "*"
opencv-python = "*"
ffmpeg-python = "*"
scikit-image = "*"
termcolor = "*"
einops = "*"
imageio = "==2.34.1"
av = "==13.0.0"
joblib = "*"

# 3D vision (pytorch3d wheel matched to py310/cu121/pyt230)
pytorch3d = { url = "https://dl.fbaipublicfiles.com/pytorch3d/packaging/wheels/py310_cu121_pyt230/pytorch3d-0.7.6-cp310-cp310-linux_x86_64.whl" }
trimesh = "*"
# sdist-only packages that fail to build during resolution (chumpy needs pip at
# build, cython_bbox needs numpy/cython). Prebuilt once via the gvhmr env's pip
# into wheels/ and referenced directly so uv installs the wheel without building.
chumpy = { path = "wheels/chumpy-0.70-py3-none-any.whl" }
smplx = "*"
wis3d = "*"
# GVHMR's SimpleVO uses the old pycolmap API (estimate_calibrated_two_view_geometry,
# cam2_from_cam1). pycolmap 4.x changed it (returns None) -> pin to the release-era 0.6.x.
pycolmap = "==0.6.1"

# 2D pose
ultralytics = "==8.2.42"
cython_bbox = { path = "wheels/cython_bbox-0.1.5-cp310-cp310-linux_x86_64.whl" }
lapx = "*"

[feature.gvhmr.tasks]
# GVHMR demo runs with cwd=GVHMR (its Hydra configs/checkpoints use paths relative to GVHMR/).
# Start from the repo root; pixi handles the directory. Trailing args are forwarded:
#   pixi run -e gvhmr gvhmr-demo --video docs/example_video/tennis.mp4
# Note: the --video path is relative to GVHMR/.
gvhmr-demo = { cmd = "python tools/demo/demo.py", cwd = "GVHMR" }

[environments]
default = { solve-group = "main" }
gmr = { features = ["gmr"], no-default-feature = true }
"5090" = { features = ["cu128"] }
gvhmr = { features = ["gvhmr"], no-default-feature = true }
